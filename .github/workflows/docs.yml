on:
  push:
    branches:
      - main
  pull_request:

name: docs

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: panvimdoc
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: terminals.nvim
          version: "Neovim >= 0.8.0"
          demojify: true
          treesitter: true
      - name: Check vimdoc is up to date
        run: |
          if ! git diff --exit-code doc/; then
            echo "::error::vimdoc is out of date — regenerate with panvimdoc and commit doc/"
            git diff doc/
            exit 1
          fi